# Publica la app en GitHub Pages.
# Requiere activar Settings → Pages → Source: GitHub Actions.
name: Publicar en GitHub Pages

on:
  push:
    # La rama principal de este repositorio. Se incluyen main/master por si
    # algún día se renombra o se fusiona el trabajo allí.
    branches:
      - claude/recipe-app-shopping-list-7jzsuy
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se lanzan varios despliegues, deja terminar el que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que los iconos están generados
        run: |
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/icon-maskable-512.png

      # `enablement` activa Pages desde el propio flujo si aún no lo está,
      # en lugar de fallar pidiendo que se active a mano.
      # Sella el service worker con este commit: sin esto los móviles
      # seguirían sirviendo la versión anterior desde su caché.
      - name: Sellar la versión en el service worker
        run: |
          sed -i "s/__COMPILACION__/${GITHUB_SHA::7}/" sw.js
          grep -q "${GITHUB_SHA::7}" sw.js || { echo "No se pudo sellar sw.js"; exit 1; }

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
